services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hospital_backend
    ports:
      - "3500:3500"
    env_file:
      - ./backend/.env
    networks:
      - platform_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_AUTH_URL=/api/auth
    container_name: hospital_frontend
    ports:
      - "3005:3000"
    depends_on:
      - backend
    networks:
      - platform_network
    restart: unless-stopped

networks:
  platform_network:
    external: true